name: android-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect the installed android toolchain
        run: |
          java -version
          gradle --version | head -6
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          command -v sdkmanager

      - name: Install the required android platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble the debug build
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect build output
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Upload the debug package
        uses: actions/upload-artifact@v4
        with:
          name: la-brow-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
