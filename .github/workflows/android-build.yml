name: android-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the java runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare the gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Inspect the installed android toolchain
        run: |
          java -version
          gradle --version | head -6
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -d "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin || true

      - name: Install the required android platform
        run: |
          CMDLINE_TOOLS="$(ls -d "${ANDROID_SDK_ROOT}"/cmdline-tools/*/bin | head -1)"
          yes | "${CMDLINE_TOOLS}/sdkmanager" --licenses > /dev/null 2>&1 || true
          "${CMDLINE_TOOLS}/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble the debug build
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect build output
        run: ls -lh android/app/build/outputs/apk/debug

      - name: Upload the debug package
        uses: actions/upload-artifact@v4
        with:
          name: la-brow-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
