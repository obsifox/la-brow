name: validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install dependencies
        run: python3 -m pip install --quiet pyyaml pillow pytest
      - name: run validation pipeline
        run: python3 tools/ci/run_gate.py --repo .
